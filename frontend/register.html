  <!DOCTYPE html>
  <html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register | AlumniConnect</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>

    <div id="navbar-placeholder"></div>

    <div class="form-wrapper" style="max-width: 520px;">
      <h2>Create Your Account</h2>
      <p class="form-subtitle">Join the community as a Student or Alumni.</p>

      <div id="formAlert" class="alert"></div>

      <form id="registerForm" novalidate>
        <div class="form-group" id="nameGroup">
          <label for="name">Full Name</label>
          <input type="text" id="name" placeholder="e.g. Priya Singh" />
          <span class="form-error">Please enter your full name.</span>
        </div>

        <div class="form-group" id="emailGroup">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="e.g. priya.singh@example.com" />
          <span class="form-error">Please enter a valid email address.</span>
        </div>

        <div class="form-group" id="passwordGroup">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="At least 6 characters" />
          <span class="form-error">Password must be at least 6 characters.</span>
        </div>

        <div class="form-group" id="roleGroup">
          <label for="role">I am a</label>
          <select id="role">
            <option value="student">Student</option>
            <option value="alumni">Alumni</option>
          </select>
        </div>

        <div class="form-group" id="departmentGroup">
          <label for="department">Department</label>
          <select id="department">
            <option>Computer Science</option>
            <option>Information Technology</option>
            <option>Electronics & Communication</option>
            <option>Mechanical Engineering</option>
            <option>Civil Engineering</option>
            <option>Electrical Engineering</option>
          </select>
        </div>

        <!-- Shown only when role = alumni -->
        <div class="form-group hidden" id="gradYearGroup">
          <label for="graduationYear">Graduation Year</label>
          <input type="number" id="graduationYear" placeholder="e.g. 2020" min="1990" max="2030" />
        </div>

        <!-- Shown only when role = student -->
        <div class="form-group" id="currentYearGroup">
          <label for="currentYear">Current Year of Study</label>
          <select id="currentYear">
            <option value="1">1st Year</option>
            <option value="2" selected>2nd Year</option>
            <option value="3">3rd Year</option>
            <option value="4">4th Year</option>
          </select>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Create Account</button>
      </form>

      <p class="form-footer-text">
        Already have an account? <a href="login.html">Login here</a>
      </p>
    </div>

    <div id="footer-placeholder"></div>

    <script src="js/api.js"></script>
    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>
  </body>
  </html>
