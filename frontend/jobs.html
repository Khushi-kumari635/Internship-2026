<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Job Board | AlumniConnect</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div id="navbar-placeholder"></div>

  <section class="section">
    <h2 class="section-title">Job & Internship Board</h2>
    <p class="section-subtitle">Opportunities posted exclusively by our alumni for students of the college.</p>

    <div class="container">
      <div style="display:flex; justify-content:flex-end; margin-bottom: 20px;">
        <button id="postJobBtn" class="btn btn-primary hidden">+ Post a Job</button>
      </div>

      <!-- ===================== FILTER BAR ===================== -->
      <div class="filter-bar">
        <div class="filter-group">
          <label for="jobSearchInput">Search by Title or Company</label>
          <input type="text" id="jobSearchInput" placeholder="e.g. Software Engineer" />
        </div>
        <div class="filter-group">
          <label for="jobTypeFilter">Job Type</label>
          <select id="jobTypeFilter">
            <option value="">All Types</option>
            <option value="Full-time">Full-time</option>
            <option value="Part-time">Part-time</option>
            <option value="Internship">Internship</option>
            <option value="Contract">Contract</option>
          </select>
        </div>
        <div class="filter-group">
          <label for="jobLocationFilter">Location</label>
          <input type="text" id="jobLocationFilter" placeholder="e.g. Bengaluru" />
        </div>
      </div>

      <div class="card-grid" id="jobsGrid">
        <!-- Filled dynamically by jobs.js -->
      </div>
    </div>
  </section>

  <!-- ===================== JOB DETAILS MODAL ===================== -->
  <div class="modal-overlay hidden" id="jobDetailsModal">
    <div class="modal-box" id="jobDetailsContent"></div>
  </div>

  <!-- ===================== POST JOB MODAL (alumni only) ===================== -->
  <div class="modal-overlay hidden" id="postJobModal">
    <div class="modal-box">
      <h3>Post a Job / Internship</h3>
      <div id="postJobAlert" class="alert"></div>
      <form id="postJobForm">
        <div class="form-group">
          <label for="jobTitleInput">Job Title</label>
          <input type="text" id="jobTitleInput" placeholder="e.g. Backend Developer" />
        </div>
        <div class="form-group">
          <label for="companyInput">Company</label>
          <input type="text" id="companyInput" placeholder="e.g. Infosys" />
        </div>
        <div class="form-group">
          <label for="jobLocationInput">Location</label>
          <input type="text" id="jobLocationInput" placeholder="e.g. Pune, Maharashtra" />
        </div>
        <div class="form-group">
          <label for="jobTypeInput">Type</label>
          <select id="jobTypeInput">
            <option value="Full-time">Full-time</option>
            <option value="Part-time">Part-time</option>
            <option value="Internship">Internship</option>
            <option value="Contract">Contract</option>
          </select>
        </div>
        <div class="form-group">
          <label for="salaryInput">Salary / Stipend</label>
          <input type="text" id="salaryInput" placeholder="e.g. 6-8 LPA or 20,000/month" />
        </div>
        <div class="form-group">
          <label for="skillsInput">Skills Required (comma separated)</label>
          <input type="text" id="skillsInput" placeholder="e.g. React, Node.js, MongoDB" />
        </div>
        <div class="form-group">
          <label for="descriptionInput">Job Description</label>
          <textarea id="descriptionInput" rows="4" placeholder="Describe the role and responsibilities..."></textarea>
        </div>
        <div style="display:flex; gap:10px;">
          <button type="submit" class="btn btn-primary btn-block">Post Job</button>
          <button type="button" class="btn btn-outline btn-block" id="closePostJobModalBtn">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <div id="footer-placeholder"></div>

  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script src="js/jobs.js"></script>
</body>
</html>
